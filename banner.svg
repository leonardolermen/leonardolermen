<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="t d">
  <title id="t">Leonardo Lermen</title>
  <desc id="d">Backend engineer from Brazil: Java and Spring, payments, risk and distributed systems, tools for AI agents.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0e16"/>
      <stop offset="1" stop-color="#05060a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f5a742" stop-opacity=".55"/>
      <stop offset=".45" stop-color="#f5a742" stop-opacity=".12"/>
      <stop offset="1" stop-color="#f5a742" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sun" cx="0.38" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#ffe2b0"/>
      <stop offset=".55" stop-color="#f5a742"/>
      <stop offset="1" stop-color="#c9741c"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#05060a" stop-opacity="0"/>
      <stop offset=".55" stop-color="#05060a" stop-opacity=".0"/>
      <stop offset="1" stop-color="#05060a" stop-opacity=".85"/>
    </linearGradient>
    <!-- órbitas (o caminho que os planetas seguem) -->
    <path id="o1" d="M 910 150 m -105 0 a 105 36 0 1 0 210 0 a 105 36 0 1 0 -210 0"/>
    <path id="o2" d="M 910 150 m -175 0 a 175 62 0 1 0 350 0 a 175 62 0 1 0 -350 0"/>
    <path id="o3" d="M 910 150 m -245 0 a 245 92 0 1 0 490 0 a 245 92 0 1 0 -490 0"/>
    <style>
      .star { fill: #cfd8ea; animation: twinkle 4s ease-in-out infinite; }
      .s2 { animation-delay: 1.3s; } .s3 { animation-delay: 2.6s; } .s4 { animation-delay: .7s; } .s5 { animation-delay: 3.4s; }
      @keyframes twinkle { 0%, 100% { opacity: .25; } 50% { opacity: .95; } }
      .orbit { fill: none; stroke: #94a3b8; stroke-opacity: .16; stroke-width: 1; stroke-dasharray: 3 6; }
      .name { font: 600 54px 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #e6e9ef; letter-spacing: .5px; }
      .tag { font: 500 16px 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #f5a742; letter-spacing: 3px; }
      .line { font: 400 24px 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #9aa3b2; }
      .pulse { animation: pulse 5s ease-in-out infinite; transform-origin: 910px 150px; }
      @keyframes pulse { 0%, 100% { transform: scale(1); opacity: .9; } 50% { transform: scale(1.08); opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        .star, .pulse { animation: none; }
        .planet animateMotion { display: none; }
      }
    </style>
  </defs>

  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>

  <!-- estrelas -->
  <g>
    <circle class="star" cx="60" cy="40" r="1.4"/><circle class="star s2" cx="180" cy="250" r="1.1"/>
    <circle class="star s3" cx="420" cy="34" r="1.3"/><circle class="star s4" cx="520" cy="268" r="1"/>
    <circle class="star s5" cx="640" cy="60" r="1.5"/><circle class="star s2" cx="710" cy="246" r="1.2"/>
    <circle class="star" cx="1010" cy="40" r="1.2"/><circle class="star s3" cx="1150" cy="92" r="1.4"/>
    <circle class="star s4" cx="1110" cy="262" r="1.1"/><circle class="star s5" cx="960" cy="276" r="1.3"/>
    <circle class="star s2" cx="300" cy="150" r=".9"/><circle class="star s4" cx="780" cy="20" r="1"/>
  </g>

  <!-- sistema solar -->
  <use href="#o1" class="orbit"/>
  <use href="#o2" class="orbit"/>
  <use href="#o3" class="orbit"/>
  <circle cx="910" cy="150" r="90" fill="url(#glow)" class="pulse"/>
  <circle cx="910" cy="150" r="26" fill="url(#sun)"/>

  <g class="planet">
    <circle r="7" fill="#7ab8ff">
      <animateMotion dur="9s" repeatCount="indefinite" rotate="0"><mpath href="#o1"/></animateMotion>
    </circle>
    <circle r="9" fill="#5fd39a">
      <animateMotion dur="16s" begin="-5s" repeatCount="indefinite"><mpath href="#o2"/></animateMotion>
    </circle>
    <circle r="5" fill="#b49cff">
      <animateMotion dur="16s" begin="-13s" repeatCount="indefinite"><mpath href="#o2"/></animateMotion>
    </circle>
    <circle r="11" fill="#f5c542" fill-opacity=".9">
      <animateMotion dur="27s" begin="-9s" repeatCount="indefinite"><mpath href="#o3"/></animateMotion>
    </circle>
  </g>
  <!-- escurece a direita para o sistema não competir com a borda -->
  <rect width="1200" height="300" rx="18" fill="url(#fade)"/>

  <!-- texto -->
  <text x="64" y="104" class="tag">BACKEND ENGINEER · BRAZIL</text>
  <text x="62" y="166" class="name">Leonardo Lermen</text>
  <!-- uma linha por vez, trocando a cada 4 s (SMIL: as três seguem o mesmo relógio) -->
  <text x="64" y="214" class="line" opacity="1">Java &amp; Spring · where almost right isn't enough
    <animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="1;1;0;0;1" keyTimes="0;.30;.33;.97;1"/>
  </text>
  <text x="64" y="214" class="line" opacity="0">Payments, risk and distributed systems
    <animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.33;.36;.63;.66;1"/>
  </text>
  <text x="64" y="214" class="line" opacity="0">Building tools that let AI agents ship code safely
    <animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;.66;.69;.97;1"/>
  </text>
</svg>
