<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Solaris (private): self-hosted hub for teams of AI coding agents, with review, previews, visual checks, an API gateway and observability"><title>Solaris (private): self-hosted hub for teams of AI coding agents, with review, previews, visual checks, an API gateway and observability</title><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1119"/><stop offset="1" stop-color="#05060a"/></linearGradient><style>
  .star { fill: #cfd8ea; animation: tw 4s ease-in-out infinite; }
  .d1 { animation-delay: 1.1s; } .d2 { animation-delay: 2.2s; } .d3 { animation-delay: 3.1s; }
  @keyframes tw { 0%, 100% { opacity: .2; } 50% { opacity: .9; } }
  .t { font-family: 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
  .m { font-family: 'Cascadia Code', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; }
  @media (prefers-reduced-motion: reduce) { .star { animation: none; opacity: .5; } }
</style></defs><rect width="1200" height="300" rx="18" fill="url(#bg)"/><rect x=".5" y=".5" width="1199" height="299" rx="17.5" fill="none" stroke="#94a3b8" stroke-opacity=".14"/><circle class="star d0" cx="934" cy="246" r="1.4"/><circle class="star d1" cx="1048" cy="105" r="1"/><circle class="star d2" cx="1056" cy="251" r="1"/><circle class="star d3" cx="200" cy="236" r="1.2"/><circle class="star d0" cx="298" cy="54" r="0.8"/><circle class="star d1" cx="819" cy="239" r="1"/><circle class="star d2" cx="38" cy="278" r="0.8"/><circle class="star d3" cx="129" cy="26" r="1"/><circle class="star d0" cx="503" cy="23" r="1.4"/><circle class="star d1" cx="676" cy="233" r="1"/><circle class="star d2" cx="1071" cy="127" r="1.2"/><circle class="star d3" cx="1031" cy="10" r="0.8"/><circle class="star d0" cx="944" cy="150" r="1.4"/><circle class="star d1" cx="1136" cy="50" r="1.2"/><circle class="star d2" cx="653" cy="125" r="1.2"/><circle class="star d3" cx="68" cy="43" r="0.8"/><circle class="star d0" cx="828" cy="63" r="1.2"/><circle class="star d1" cx="799" cy="42" r="0.8"/><circle cx="70" cy="72" r="57.2" fill="#f5a742" fill-opacity=".10"/><circle cx="70" cy="72" r="26" fill="#f5a742"/><circle cx="60.9" cy="62.9" r="11.700000000000001" fill="#fff" fill-opacity=".18"/><ellipse cx="70" cy="72" rx="45.5" ry="13.0" fill="none" stroke="#f5a742" stroke-opacity=".7" stroke-width="2" transform="rotate(-18 70 72)"/><path d="M 20.6 72 a 49.4 20.8 0 1 0 98.8 0 a 49.4 20.8 0 1 0 -98.8 0" fill="none" stroke="#94a3b8" stroke-opacity=".18" stroke-dasharray="2 4"/><circle r="5.2" fill="#e6e9ef"><animateMotion dur="7s" repeatCount="indefinite" path="M 20.6 72 a 49.4 20.8 0 1 0 98.8 0 a 49.4 20.8 0 1 0 -98.8 0"/></circle><text x="130" y="62" class="t" font-size="12" font-weight="600" letter-spacing="2.5" fill="#f5a742">AI ENGINEERING · SELF-HOSTED HUB</text><text x="130" y="96" class="t" font-size="30" font-weight="600" fill="#e6e9ef">Solaris</text><rect x="250" y="74" width="74" height="24" rx="12" fill="#94a3b8" fill-opacity=".14" stroke="#94a3b8" stroke-opacity=".4"/><text x="287" y="90.5" text-anchor="middle" class="t" font-size="12" font-weight="600" fill="#9aa3b2">private</text><text x="130" y="124" class="t" font-size="16" fill="#9aa3b2">Where teams of AI coding agents (Claude Code and Codex) work on my repositories, and where I watch what they ship.</text><circle cx="138" cy="157" r="4" fill="#7ab8ff"/><text x="152" y="162" class="t" font-size="15" fill="#c7cdd8">Each task in its own worktree; a team (plan → build → review) is approved as one unit, with a single PR</text><circle cx="138" cy="183" r="4" fill="#5fd39a"/><text x="152" y="188" class="t" font-size="15" fill="#c7cdd8">Review with a live preview, an adjustments chat, automatic tests and a visual check on desktop and mobile</text><circle cx="138" cy="209" r="4" fill="#b49cff"/><text x="152" y="214" class="t" font-size="15" fill="#c7cdd8">Agents improve their own prompts and skills from evidence, versioned and reversible</text><circle cx="138" cy="235" r="4" fill="#f5c542"/><text x="152" y="240" class="t" font-size="15" fill="#c7cdd8">API gateway (JWT, API keys, mTLS, caching) and OpenTelemetry observability with anomaly detection</text><rect x="130" y="254" width="37" height="26" rx="13" fill="#f5a742" fill-opacity=".12" stroke="#f5a742" stroke-opacity=".45"/><text x="148.5" y="271.5" text-anchor="middle" class="t" font-size="13" font-weight="500" fill="#e6e9ef">Go</text><rect x="175" y="254" width="113" height="26" rx="13" fill="#f5a742" fill-opacity=".12" stroke="#f5a742" stroke-opacity=".45"/><text x="231.5" y="271.5" text-anchor="middle" class="t" font-size="13" font-weight="500" fill="#e6e9ef">templ + htmx</text><rect x="296" y="254" width="67" height="26" rx="13" fill="#f5a742" fill-opacity=".12" stroke="#f5a742" stroke-opacity=".45"/><text x="329.5" y="271.5" text-anchor="middle" class="t" font-size="13" font-weight="500" fill="#e6e9ef">SQLite</text><rect x="371" y="254" width="120" height="26" rx="13" fill="#f5a742" fill-opacity=".12" stroke="#f5a742" stroke-opacity=".45"/><text x="431.0" y="271.5" text-anchor="middle" class="t" font-size="13" font-weight="500" fill="#e6e9ef">OpenTelemetry</text><rect x="499" y="254" width="44" height="26" rx="13" fill="#f5a742" fill-opacity=".12" stroke="#f5a742" stroke-opacity=".45"/><text x="521.0" y="271.5" text-anchor="middle" class="t" font-size="13" font-weight="500" fill="#e6e9ef">MCP</text><rect x="551" y="254" width="136" height="26" rx="13" fill="#f5a742" fill-opacity=".12" stroke="#f5a742" stroke-opacity=".45"/><text x="619.0" y="271.5" text-anchor="middle" class="t" font-size="13" font-weight="500" fill="#e6e9ef">Windows desktop</text><path d="M 970 92 a 70 26 0 1 0 140 0 a 70 26 0 1 0 -140 0" fill="none" stroke="#94a3b8" stroke-opacity=".14" stroke-dasharray="3 6"/><circle r="5" fill="#7ab8ff"><animateMotion dur="9s" repeatCount="indefinite" path="M 970 92 a 70 26 0 1 0 140 0 a 70 26 0 1 0 -140 0"/></circle><path d="M 920 92 a 120 44 0 1 0 240 0 a 120 44 0 1 0 -240 0" fill="none" stroke="#94a3b8" stroke-opacity=".14" stroke-dasharray="3 6"/><circle r="5" fill="#5fd39a"><animateMotion dur="15s" repeatCount="indefinite" path="M 920 92 a 120 44 0 1 0 240 0 a 120 44 0 1 0 -240 0"/></circle><path d="M 870 92 a 170 62 0 1 0 340 0 a 170 62 0 1 0 -340 0" fill="none" stroke="#94a3b8" stroke-opacity=".14" stroke-dasharray="3 6"/><circle r="5" fill="#f5c542"><animateMotion dur="23s" repeatCount="indefinite" path="M 870 92 a 170 62 0 1 0 340 0 a 170 62 0 1 0 -340 0"/></circle><circle cx="1040" cy="92" r="40" fill="#f5a742" fill-opacity=".10"/><circle cx="1040" cy="92" r="14" fill="#f5a742"/></svg>
